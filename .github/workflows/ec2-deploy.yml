name: Deploy EC2 CloudFormation Stack

on:
  push:
    branches: [main]
    paths:
      - 'new-project-template.yaml'
      - '.github/workflows/ec2-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: ca-central-1
  STACK_NAME: my-ec2-stack

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate template
        run: aws cloudformation validate-template --template-body file://ec2-webserver.yaml

      - name: Deploy stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: ec2-webserver.yaml
          parameter-overrides: >-
            AmiId=${{ vars.AMI_ID }},
            InstanceType=t3.micro,
            KeyPairName=${{ vars.KEY_PAIR_NAME }}
          no-fail-on-empty-changeset: "1"

      - name: Show outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs" --output table